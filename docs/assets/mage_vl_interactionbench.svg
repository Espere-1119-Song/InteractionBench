<svg xmlns="http://www.w3.org/2000/svg" width="1600" height="1000" viewBox="0 0 1600 1000" role="img" aria-labelledby="title desc">
  <title id="title">Mage-VL-4B on InteractionBench</title>
  <desc id="desc">Full benchmark summary, comparable sliding-model leaderboard, and capability breakdown.</desc>
  <defs>
    <filter id="shadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="6" stdDeviation="10" flood-color="#0f172a" flood-opacity="0.08"/>
    </filter>
    <linearGradient id="mage" x1="0" x2="1">
      <stop offset="0" stop-color="#2563eb"/>
      <stop offset="1" stop-color="#60a5fa"/>
    </linearGradient>
    <linearGradient id="cap" x1="0" x2="1">
      <stop offset="0" stop-color="#3b82f6"/>
      <stop offset="1" stop-color="#93c5fd"/>
    </linearGradient>
    <style>
      .sans { font-family: Inter, ui-sans-serif, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif; }
      .title { font-size: 42px; font-weight: 760; fill: #0f172a; }
      .subtitle { font-size: 19px; font-weight: 450; fill: #64748b; }
      .panel-title { font-size: 24px; font-weight: 720; fill: #0f172a; }
      .panel-subtitle { font-size: 15px; fill: #64748b; }
      .card-label { font-size: 14px; font-weight: 650; letter-spacing: 1.4px; fill: #64748b; }
      .card-value { font-size: 38px; font-weight: 760; fill: #0f172a; }
      .row-label { font-size: 17px; font-weight: 590; fill: #334155; }
      .value { font-size: 16px; font-weight: 720; fill: #0f172a; }
      .tick { font-size: 13px; fill: #94a3b8; }
      .badge { font-size: 14px; font-weight: 720; fill: #1d4ed8; }
      .footer { font-size: 14px; fill: #64748b; }
    </style>
  </defs>

  <rect width="1600" height="1000" fill="#f8fafc"/>
  <g class="sans">
    <text id="titleText" x="60" y="66" class="title">Mage-VL-4B on InteractionBench</text>
    <text x="60" y="98" class="subtitle">All 1,060 items · default polling / sliding-window protocol · Qwen3-14B judge v2</text>

    <!-- Summary cards -->
    <g filter="url(#shadow)">
      <rect x="60" y="125" width="340" height="112" rx="18" fill="#ffffff"/>
      <rect x="440" y="125" width="340" height="112" rx="18" fill="#ffffff"/>
      <rect x="820" y="125" width="340" height="112" rx="18" fill="#ffffff"/>
      <rect x="1200" y="125" width="340" height="112" rx="18" fill="#ffffff"/>
    </g>
    <rect x="60" y="125" width="7" height="112" rx="3.5" fill="#2563eb"/>
    <text x="91" y="160" class="card-label">TOTAL</text><text x="91" y="209" class="card-value">33.7</text>
    <text x="471" y="160" class="card-label">ACCURACY</text><text x="471" y="209" class="card-value">46.9</text>
    <text x="851" y="160" class="card-label">TIMING ACCURACY</text><text x="851" y="209" class="card-value">65.5</text>
    <text x="1231" y="160" class="card-label">SILENCE COMPLIANCE</text><text x="1231" y="209" class="card-value">21.0</text>

    <!-- Panels -->
    <rect x="60" y="275" width="720" height="650" rx="22" fill="#ffffff" filter="url(#shadow)"/>
    <rect x="820" y="275" width="720" height="650" rx="22" fill="#ffffff" filter="url(#shadow)"/>

    <!-- Panel A -->
    <text x="92" y="325" class="panel-title">Comparable sliding-model leaderboard</text>
    <text x="92" y="354" class="panel-subtitle">Total score · identical all1060 protocol</text>
    <rect x="638" y="304" width="108" height="36" rx="18" fill="#dbeafe"/>
    <text x="692" y="327" text-anchor="middle" class="badge">#3 of 7</text>

    <!-- Ranking grid: x=300..700, 0..40 -->
    <g stroke="#e2e8f0" stroke-width="1">
      <line x1="300" y1="390" x2="300" y2="865"/>
      <line x1="400" y1="390" x2="400" y2="865" stroke-dasharray="4 5"/>
      <line x1="500" y1="390" x2="500" y2="865" stroke-dasharray="4 5"/>
      <line x1="600" y1="390" x2="600" y2="865" stroke-dasharray="4 5"/>
      <line x1="700" y1="390" x2="700" y2="865" stroke-dasharray="4 5"/>
    </g>
    <g class="tick" text-anchor="middle">
      <text x="300" y="887">0</text><text x="400" y="887">10</text><text x="500" y="887">20</text><text x="600" y="887">30</text><text x="700" y="887">40</text>
    </g>

    <g>
      <text x="92" y="428" class="row-label">Qwen3-VL-8B</text><rect x="300" y="407" width="400" height="28" rx="7" fill="#f1f5f9"/><rect x="300" y="407" width="348" height="28" rx="7" fill="#94a3b8"/><text x="660" y="427" class="value">34.8</text>
      <text x="92" y="494" class="row-label">LLaVA-OV2-8B</text><rect x="300" y="473" width="400" height="28" rx="7" fill="#f1f5f9"/><rect x="300" y="473" width="345" height="28" rx="7" fill="#94a3b8"/><text x="657" y="493" class="value">34.5</text>
      <rect x="80" y="520" width="668" height="66" rx="12" fill="#eff6ff"/>
      <text x="92" y="560" class="row-label" fill="#1d4ed8" style="font-weight:740">Mage-VL-4B</text><rect x="300" y="539" width="400" height="28" rx="7" fill="#dbeafe"/><rect x="300" y="539" width="337" height="28" rx="7" fill="url(#mage)"/><text x="649" y="559" class="value" fill="#1d4ed8">33.7</text>
      <text x="92" y="626" class="row-label">MiniCPM-o-4.5</text><rect x="300" y="605" width="400" height="28" rx="7" fill="#f1f5f9"/><rect x="300" y="605" width="290" height="28" rx="7" fill="#cbd5e1"/><text x="602" y="625" class="value">29.0</text>
      <text x="92" y="692" class="row-label">Gemma-3n-E4B</text><rect x="300" y="671" width="400" height="28" rx="7" fill="#f1f5f9"/><rect x="300" y="671" width="278" height="28" rx="7" fill="#cbd5e1"/><text x="590" y="691" class="value">27.8</text>
      <text x="92" y="758" class="row-label">Qwen3-VL-4B</text><rect x="300" y="737" width="400" height="28" rx="7" fill="#f1f5f9"/><rect x="300" y="737" width="262" height="28" rx="7" fill="#cbd5e1"/><text x="574" y="757" class="value">26.2</text>
      <text x="92" y="824" class="row-label">Qwen2.5-Omni-7B</text><rect x="300" y="803" width="400" height="28" rx="7" fill="#f1f5f9"/><rect x="300" y="803" width="187" height="28" rx="7" fill="#cbd5e1"/><text x="499" y="823" class="value">18.7</text>
    </g>

    <!-- Panel B -->
    <text x="852" y="325" class="panel-title">Mage capability breakdown</text>
    <text x="852" y="354" class="panel-subtitle">Total score by benchmark capability group</text>
    <rect x="1300" y="304" width="208" height="36" rx="18" fill="#dbeafe"/>
    <text x="1404" y="327" text-anchor="middle" class="badge">#1 listed 4B-scale</text>

    <!-- Capability grid: x=1100..1500, 0..45 -->
    <g stroke="#e2e8f0" stroke-width="1">
      <line x1="1100" y1="390" x2="1100" y2="810"/>
      <line x1="1189" y1="390" x2="1189" y2="810" stroke-dasharray="4 5"/>
      <line x1="1278" y1="390" x2="1278" y2="810" stroke-dasharray="4 5"/>
      <line x1="1367" y1="390" x2="1367" y2="810" stroke-dasharray="4 5"/>
      <line x1="1456" y1="390" x2="1456" y2="810" stroke-dasharray="4 5"/>
      <line x1="1500" y1="390" x2="1500" y2="810" stroke-dasharray="4 5"/>
    </g>
    <g class="tick" text-anchor="middle">
      <text x="1100" y="834">0</text><text x="1189" y="834">10</text><text x="1278" y="834">20</text><text x="1367" y="834">30</text><text x="1456" y="834">40</text><text x="1500" y="834">45</text>
    </g>

    <g>
      <text x="852" y="428" class="row-label">LVM</text><rect x="1100" y="407" width="400" height="28" rx="7" fill="#eff6ff"/><rect x="1100" y="407" width="371" height="28" rx="7" fill="url(#cap)"/><text x="1483" y="427" class="value">41.7</text>
      <text x="852" y="494" class="row-label">PTR</text><rect x="1100" y="473" width="400" height="28" rx="7" fill="#eff6ff"/><rect x="1100" y="473" width="355" height="28" rx="7" fill="url(#cap)"/><text x="1467" y="493" class="value">39.9</text>
      <text x="852" y="560" class="row-label">LCG</text><rect x="1100" y="539" width="400" height="28" rx="7" fill="#eff6ff"/><rect x="1100" y="539" width="332" height="28" rx="7" fill="url(#cap)"/><text x="1444" y="559" class="value">37.3</text>
      <text x="852" y="626" class="row-label">IVQA + CIR</text><rect x="1100" y="605" width="400" height="28" rx="7" fill="#eff6ff"/><rect x="1100" y="605" width="316" height="28" rx="7" fill="url(#cap)"/><text x="1428" y="625" class="value">35.5</text>
      <text x="852" y="692" class="row-label">TOA</text><rect x="1100" y="671" width="400" height="28" rx="7" fill="#eff6ff"/><rect x="1100" y="671" width="235" height="28" rx="7" fill="url(#cap)"/><text x="1347" y="691" class="value">26.4</text>
      <text x="852" y="758" class="row-label">CST + BRC</text><rect x="1100" y="737" width="400" height="28" rx="7" fill="#eff6ff"/><rect x="1100" y="737" width="162" height="28" rx="7" fill="url(#cap)"/><text x="1274" y="757" class="value">18.2</text>
    </g>

    <text x="852" y="877" class="panel-subtitle">Strongest: long-term visual memory and proactive triggers</text>
    <text x="852" y="902" class="panel-subtitle">Main opportunity: continuous state/count tracking</text>

    <line x1="60" y1="954" x2="1540" y2="954" stroke="#e2e8f0"/>
    <text x="60" y="980" class="footer">Mage exact total: 33.668 · 1,060 unique items · 0 failures · 119,412 polls</text>
    <text x="1540" y="980" text-anchor="end" class="footer">Identical-protocol comparisons only · native codec/gate not evaluated</text>
  </g>
</svg>
